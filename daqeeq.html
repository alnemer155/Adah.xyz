<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دقيق</title>
<meta name="description" content="بحث دقيق يجاوب على أسئلتك مباشرة عبر عدة مزودين للذكاء الاصطناعي.">
<link rel="canonical" href="https://t18.adah.binjaafar.xyz">
<meta property="og:type" content="website">
<meta property="og:title" content="دقيق">
<meta property="og:description" content="بحث دقيق يجاوب على أسئلتك مباشرة عبر عدة مزودين للذكاء الاصطناعي.">
<meta property="og:url" content="https://t18.adah.binjaafar.xyz">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="دقيق">
<meta name="twitter:description" content="بحث دقيق يجاوب على أسئلتك مباشرة عبر عدة مزودين للذكاء الاصطناعي.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;500&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FFFFFF;
  --ink:#0B0C0E;
  --blue:#1E4FFF;
  --grey:#9AA0A8;
  --grey-line:#D8DADD;
  --grey-tint:#F4F4F5;
  --amber:#B4690E;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:200;
  min-height:100%;
}

.topbar{
  padding:32px clamp(20px,5vw,56px) 24px;
  display:flex;
  justify-content:center;
  background:transparent;
}

.logo{
  font-weight:500;
  font-size:clamp(24px, 3.4vw, 34px);
  letter-spacing:0.02em;
}

main{
  max-width:720px;
  margin:0 auto;
  padding:clamp(8px,5vw,24px) clamp(20px,5vw,56px) 80px;
}

.intro{
  margin-bottom:clamp(24px,4vw,36px);
  max-width:560px;
  margin-left:auto;
  margin-right:auto;
  text-align:center;
}

.intro h1{
  font-weight:500;
  font-size:clamp(28px,4.4vw,40px);
  line-height:1.25;
  margin-bottom:14px;
}

.intro p{
  font-weight:300;
  font-size:15px;
  color:var(--grey);
  line-height:1.7;
}

/* provider tabs */
.provider-tabs{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  border:1px solid var(--grey-line);
  margin-bottom:16px;
}

.provider-tabs button{
  border:none;
  border-left:1px solid var(--grey-line);
  padding:12px 4px;
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:300;
  font-size:12px;
  cursor:pointer;
  border-radius:0;
}

.provider-tabs button:last-child{border-left:none;}
.provider-tabs button.active{background:var(--blue); color:var(--paper); font-weight:500;}

@media (max-width:520px){
  .provider-tabs{grid-template-columns:repeat(3, 1fr);}
  .provider-tabs button:nth-child(3){border-left:none;}
  .provider-tabs button:nth-child(4),
  .provider-tabs button:nth-child(5){border-top:1px solid var(--grey-line);}
}

.cors-warning{
  border:1px solid var(--amber);
  background:#FDF6EC;
  color:var(--amber);
  padding:12px 16px;
  font-size:12px;
  line-height:1.8;
  margin-bottom:16px;
  display:none;
}

.cors-warning.show{display:block;}

/* API key setup */
.key-section{
  border:1px solid var(--grey-line);
  padding:20px;
  margin-bottom:24px;
}

.key-section.hidden{display:none;}

.key-label{
  font-size:12px;
  color:var(--grey);
  font-weight:300;
  margin-bottom:10px;
  line-height:1.7;
}

.key-label a{color:var(--blue);}

.key-row{
  display:flex;
  gap:0;
  border:1px solid var(--ink);
  margin-bottom:10px;
}

.key-row input{
  flex:1;
  border:none;
  padding:12px 14px;
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:300;
  font-size:14px;
  outline:none;
  direction:ltr;
  text-align:left;
}

.key-row button{
  border:none;
  border-right:1px solid var(--ink);
  background:var(--blue);
  color:var(--paper);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:500;
  font-size:13px;
  padding:0 18px;
  cursor:pointer;
}

.key-status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--grey);
}

.key-status .connected{color:var(--blue); font-weight:500;}

.forget-btn{
  background:none;
  border:none;
  color:var(--grey);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-size:12px;
  text-decoration:underline;
  cursor:pointer;
  padding:0;
}

/* search */
.search-row{
  display:flex;
  gap:0;
  border:1px solid var(--ink);
  margin-bottom:16px;
}

.search-row textarea{
  flex:1;
  border:none;
  padding:16px 18px;
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:300;
  font-size:16px;
  color:var(--ink);
  background:var(--paper);
  outline:none;
  resize:none;
  min-height:56px;
}

.search-btn{
  border:none;
  border-right:1px solid var(--ink);
  background:var(--blue);
  color:var(--paper);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:500;
  font-size:14px;
  padding:0 24px;
  cursor:pointer;
  white-space:nowrap;
}

.search-btn:hover{opacity:.88;}
.search-btn:disabled{opacity:.5; cursor:not-allowed;}

.options-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:28px;
}

.toggle-inline{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--grey);
  cursor:pointer;
  user-select:none;
}

.toggle-inline .switch{
  width:36px;
  height:20px;
  border:1px solid var(--ink);
  position:relative;
  background:var(--paper);
  flex-shrink:0;
}

.toggle-inline .switch::after{
  content:'';
  position:absolute;
  top:1px;
  right:1px;
  width:16px;
  height:16px;
  background:var(--ink);
  transition:transform .12s ease, background .12s ease;
}

.toggle-inline input{position:absolute; opacity:0; pointer-events:none;}

.toggle-inline input:checked + .switch{background:var(--blue); border-color:var(--blue);}
.toggle-inline input:checked + .switch::after{transform:translateX(-16px); background:var(--paper);}

.model-select{
  display:flex;
  border:1px solid var(--grey-line);
}

.model-select button{
  border:none;
  border-left:1px solid var(--grey-line);
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-size:12px;
  padding:8px 12px;
  cursor:pointer;
}

.model-select button:last-child{border-left:none;}
.model-select button.active{background:var(--blue); color:var(--paper);}

/* results */
.answer-section{
  border:1px solid var(--grey-line);
  padding:clamp(20px,4vw,32px);
}

.answer-text{
  font-size:16px;
  line-height:2;
  white-space:pre-wrap;
}

.loading{
  text-align:center;
  padding:50px 10px;
  color:var(--grey);
  font-size:14px;
}

.dots::after{
  content:'';
  animation:dots 1.4s infinite;
}

@keyframes dots{
  0%, 20%{content:'.'}
  40%{content:'..'}
  60%, 100%{content:'...'}
}

.empty-state{
  color:var(--grey);
  font-size:13px;
  text-align:center;
  padding:50px 10px;
}

.error-state{
  color:#C0392B;
  font-size:14px;
  text-align:center;
  padding:30px 10px;
  line-height:1.8;
}

.sources{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--grey-line);
}

.sources-label{
  font-size:12px;
  color:var(--grey);
  font-weight:500;
  margin-bottom:10px;
}

.source-link{
  display:block;
  font-size:13px;
  color:var(--blue);
  text-decoration:none;
  margin-bottom:8px;
  direction:ltr;
  text-align:right;
  word-break:break-all;
}

.source-link:hover{text-decoration:underline;}

footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:var(--grey);
  border-top:1px solid var(--grey-line);
  margin-top:24px;
}

footer a{
  color:var(--grey);
  text-decoration:none;
  border-bottom:1px solid var(--grey-line);
  transition:color .12s ease, border-color .12s ease;
}

footer a:hover{
  color:var(--blue);
  border-color:var(--blue);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">دقيق</div>
</div>

<main>
  <div class="intro">
    <h1>اسأل، يجاوبك دقيق</h1>
    <p>يجاوب على سؤالك مباشرة بدل ما يعطيك قائمة روابط تدوّر فيها بنفسك.</p>
  </div>

  <div class="provider-tabs" id="providerTabs">
    <button data-provider="anthropic" class="active">Anthropic</button>
    <button data-provider="google">Google</button>
    <button data-provider="openai">OpenAI</button>
    <button data-provider="cloudflare">Cloudflare</button>
    <button data-provider="gmi">GMI Cloud</button>
  </div>

  <div class="cors-warning" id="corsWarning"></div>

  <div class="key-section" id="keySection"></div>

  <div class="key-section hidden" id="keyStatusSection">
    <div class="key-status">
      <span class="connected">✓ متصل بمفتاحك</span>
      <button class="forget-btn" id="forgetKeyBtn">نسيان المفتاح</button>
    </div>
  </div>

  <div class="search-row">
    <textarea id="questionInput" placeholder="مثال: هل الذكاء الاصطناعي خطر؟" rows="1"></textarea>
    <button class="search-btn" id="askBtn">اسأل</button>
  </div>

  <div class="options-row">
    <label class="toggle-inline" id="webSearchLabel">
      <input type="checkbox" id="webSearchToggle" checked>
      <span class="switch"></span>
      بحث بالإنترنت لمعلومات حديثة
    </label>

    <div class="model-select" id="modelSelect"></div>
  </div>

  <div class="answer-section">
    <div id="answerWrap">
      <div class="empty-state">اكتب سؤالك واضغط "اسأل"</div>
    </div>
  </div>
</main>

<footer>دقيق — <a href="https://t18.adah.binjaafar.xyz">t18.adah.binjaafar.xyz</a></footer>

<script>
const PROVIDERS = {
  anthropic: {
    label: 'Anthropic',
    corsOk: true,
    keyFields: [{ id: 'key', label: 'مفتاح API', placeholder: 'sk-ant-...' }],
    keyLink: 'https://console.anthropic.com/settings/keys',
    models: [
      { id: 'claude-haiku-4-5-20251001', label: 'أسرع' },
      { id: 'claude-sonnet-5', label: 'متوازن' },
      { id: 'claude-opus-4-8', label: 'الأدق' }
    ],
    supportsWebSearch: true
  },
  google: {
    label: 'Google',
    corsOk: true,
    keyFields: [{ id: 'key', label: 'مفتاح API', placeholder: 'AIza...' }],
    keyLink: 'https://aistudio.google.com/apikey',
    models: [
      { id: 'gemini-3.7-flash', label: 'أسرع' },
      { id: 'gemini-3.1-pro', label: 'الأدق' }
    ],
    supportsWebSearch: false
  },
  openai: {
    label: 'OpenAI',
    corsOk: false,
    keyFields: [{ id: 'key', label: 'مفتاح API', placeholder: 'sk-...' }],
    keyLink: 'https://platform.openai.com/api-keys',
    models: [
      { id: 'gpt-5.6-luna', label: 'أسرع' },
      { id: 'gpt-5.6-sol', label: 'الأدق' }
    ],
    supportsWebSearch: false
  },
  cloudflare: {
    label: 'Cloudflare',
    corsOk: false,
    keyFields: [
      { id: 'account', label: 'Account ID', placeholder: 'account id' },
      { id: 'key', label: 'API Token', placeholder: 'token' }
    ],
    keyLink: 'https://dash.cloudflare.com/profile/api-tokens',
    models: [
      { id: '@cf/meta/llama-3.3-70b-instruct-fp8-fast', label: 'أسرع' },
      { id: '@cf/openai/gpt-oss-120b', label: 'الأدق' }
    ],
    supportsWebSearch: false
  },
  gmi: {
    label: 'GMI Cloud',
    corsOk: false,
    keyFields: [{ id: 'key', label: 'مفتاح API', placeholder: 'gmi-...' }],
    keyLink: 'https://console.gmicloud.ai',
    models: [
      { id: 'deepseek-ai/DeepSeek-V4', label: 'أسرع' },
      { id: 'openai/gpt-5.6-sol', label: 'الأدق' }
    ],
    supportsWebSearch: false
  }
};

let currentProvider = 'anthropic';
let currentModel = PROVIDERS.anthropic.models[1].id;
let storedKeys = {};

try{
  const raw = localStorage.getItem('daqeeq-keys');
  storedKeys = raw ? JSON.parse(raw) : {};
}catch(e){ storedKeys = {}; }

function saveKeys(){
  try{ localStorage.setItem('daqeeq-keys', JSON.stringify(storedKeys)); }catch(e){}
}

const providerTabs = document.getElementById('providerTabs');
const corsWarning = document.getElementById('corsWarning');
const keySection = document.getElementById('keySection');
const keyStatusSection = document.getElementById('keyStatusSection');
const forgetKeyBtn = document.getElementById('forgetKeyBtn');
const modelSelect = document.getElementById('modelSelect');
const webSearchLabel = document.getElementById('webSearchLabel');
const webSearchToggle = document.getElementById('webSearchToggle');
const questionInput = document.getElementById('questionInput');
const askBtn = document.getElementById('askBtn');
const answerWrap = document.getElementById('answerWrap');

function hasKey(provider){
  const p = PROVIDERS[provider];
  const saved = storedKeys[provider] || {};
  return p.keyFields.every(f => saved[f.id]);
}

function renderKeySection(){
  const p = PROVIDERS[currentProvider];
  const saved = storedKeys[currentProvider] || {};

  if(hasKey(currentProvider)){
    keySection.classList.add('hidden');
    keyStatusSection.classList.remove('hidden');
    return;
  }

  keySection.classList.remove('hidden');
  keyStatusSection.classList.add('hidden');

  let html = `<div class="key-label">دقيق يشتغل بمفتاحك الخاص عند ${p.label} — يُحفظ بمتصفحك فقط ولا يروح لأي سيرفر ثاني. احصل على مفتاح من <a href="${p.keyLink}" target="_blank" rel="noopener">${p.keyLink.replace('https://','')}</a></div>`;

  p.keyFields.forEach(f => {
    html += `<div class="key-row"><input type="password" id="field-${f.id}" placeholder="${f.placeholder}"></div>`;
  });

  html += `<div class="key-row" style="border:none;"><button id="saveKeyBtn" style="border:1px solid var(--ink); width:100%;">حفظ</button></div>`;

  keySection.innerHTML = html;

  document.getElementById('saveKeyBtn').addEventListener('click', () => {
    const values = {};
    let allFilled = true;
    p.keyFields.forEach(f => {
      const val = document.getElementById(`field-${f.id}`).value.trim();
      if(!val) allFilled = false;
      values[f.id] = val;
    });
    if(!allFilled) return;
    storedKeys[currentProvider] = values;
    saveKeys();
    renderKeySection();
  });
}

function renderModelSelect(){
  const p = PROVIDERS[currentProvider];
  modelSelect.innerHTML = '';
  p.models.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.textContent = m.label;
    btn.dataset.model = m.id;
    if(i === p.models.length - 1) btn.classList.add('active');
    btn.addEventListener('click', () => {
      modelSelect.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentModel = m.id;
    });
    modelSelect.appendChild(btn);
  });
  currentModel = p.models[p.models.length - 1].id;
}

function renderCorsWarning(){
  const p = PROVIDERS[currentProvider];
  if(p.corsOk){
    corsWarning.classList.remove('show');
  }else{
    corsWarning.textContent = `تنويه: ${p.label} لا يدعم النداء المباشر من المتصفح (قيود CORS من طرفهم) — الطلب غالبًا بيفشل إلا إذا مرّرته عبر سيرفر وسيط. جرّب Anthropic أو Google للاتصال المباشر المضمون.`;
    corsWarning.classList.add('show');
  }
}

function switchProvider(provider){
  currentProvider = provider;
  providerTabs.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.provider === provider));
  renderCorsWarning();
  renderKeySection();
  renderModelSelect();
  webSearchLabel.style.display = PROVIDERS[provider].supportsWebSearch ? 'flex' : 'none';
  answerWrap.innerHTML = '<div class="empty-state">اكتب سؤالك واضغط "اسأل"</div>';
}

providerTabs.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => switchProvider(btn.dataset.provider));
});

forgetKeyBtn.addEventListener('click', () => {
  delete storedKeys[currentProvider];
  saveKeys();
  renderKeySection();
});

questionInput.addEventListener('input', () => {
  questionInput.style.height = 'auto';
  questionInput.style.height = questionInput.scrollHeight + 'px';
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function callAnthropic(question, keys){
  const body = {
    model: currentModel,
    max_tokens: 1500,
    system: 'أجب بالعربية الفصحى الواضحة، بدقة ووضوح ومن غير حشو.',
    messages: [{ role: 'user', content: question }]
  };
  if(webSearchToggle.checked){
    body.tools = [{ type: 'web_search_20250305', name: 'web_search' }];
  }

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': keys.key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data?.error?.message || 'خطأ غير معروف');

  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n\n').trim();
  const sources = [];
  (data.content || []).forEach(block => {
    if(block.type === 'web_search_tool_result' && Array.isArray(block.content)){
      block.content.forEach(item => {
        if(item.url && item.title) sources.push({ url: item.url, title: item.title });
      });
    }
  });
  return { text: text || 'ما رجع أي نص بالإجابة.', sources };
}

async function callGoogle(question, keys){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${encodeURIComponent(keys.key)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: question }] }],
      systemInstruction: { parts: [{ text: 'أجب بالعربية الفصحى الواضحة، بدقة ووضوح ومن غير حشو.' }] }
    })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data?.error?.message || 'خطأ غير معروف');
  const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('\n') || 'ما رجع أي نص بالإجابة.';
  return { text, sources: [] };
}

async function callOpenAI(question, keys){
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${keys.key}`,
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      model: currentModel,
      messages: [
        { role: 'system', content: 'أجب بالعربية الفصحى الواضحة، بدقة ووضوح ومن غير حشو.' },
        { role: 'user', content: question }
      ]
    })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data?.error?.message || 'خطأ غير معروف');
  const text = data?.choices?.[0]?.message?.content || 'ما رجع أي نص بالإجابة.';
  return { text, sources: [] };
}

async function callGmi(question, keys){
  const res = await fetch('https://api.gmi-serving.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${keys.key}`,
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      model: currentModel,
      messages: [
        { role: 'system', content: 'أجب بالعربية الفصحى الواضحة، بدقة ووضوح ومن غير حشو.' },
        { role: 'user', content: question }
      ]
    })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data?.error?.message || 'خطأ غير معروف');
  const text = data?.choices?.[0]?.message?.content || 'ما رجع أي نص بالإجابة.';
  return { text, sources: [] };
}

async function callCloudflare(question, keys){
  const res = await fetch(`https://api.cloudflare.com/client/v4/accounts/${keys.account}/ai/run/${currentModel}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${keys.key}`,
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      messages: [
        { role: 'system', content: 'أجب بالعربية الفصحى الواضحة، بدقة ووضوح ومن غير حشو.' },
        { role: 'user', content: question }
      ]
    })
  });
  const data = await res.json();
  if(!res.ok || data.success === false) throw new Error((data.errors && data.errors[0] && data.errors[0].message) || 'خطأ غير معروف');
  const text = data?.result?.response || 'ما رجع أي نص بالإجابة.';
  return { text, sources: [] };
}

const CALLERS = {
  anthropic: callAnthropic,
  google: callGoogle,
  openai: callOpenAI,
  cloudflare: callCloudflare,
  gmi: callGmi
};

async function askQuestion(){
  const question = questionInput.value.trim();
  if(!question){
    questionInput.focus();
    return;
  }
  if(!hasKey(currentProvider)){
    answerWrap.innerHTML = '<div class="error-state">أدخل مفتاح API أولًا فوق</div>';
    return;
  }

  askBtn.disabled = true;
  answerWrap.innerHTML = '<div class="loading"><span class="dots">يفكر</span></div>';

  try{
    const keys = storedKeys[currentProvider];
    const result = await CALLERS[currentProvider](question, keys);

    let html = `<div class="answer-text">${escapeHtml(result.text)}</div>`;
    if(result.sources && result.sources.length > 0){
      html += '<div class="sources"><div class="sources-label">مصادر</div>';
      const seen = new Set();
      result.sources.forEach(s => {
        if(seen.has(s.url)) return;
        seen.add(s.url);
        html += `<a class="source-link" href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>`;
      });
      html += '</div>';
    }
    answerWrap.innerHTML = html;
  }catch(err){
    const corsHint = !PROVIDERS[currentProvider].corsOk
      ? ' — هذا متوقع لأن هذا المزود ما يدعم الاتصال المباشر من المتصفح (راجع التنويه فوق).'
      : '';
    answerWrap.innerHTML = `<div class="error-state">تعذّر الحصول على إجابة: ${escapeHtml(err.message)}${corsHint}</div>`;
  }

  askBtn.disabled = false;
}

askBtn.addEventListener('click', askQuestion);
questionInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    askQuestion();
  }
});

switchProvider('anthropic');
</script>
