:root{
  --paper:#FFFFFF;
  --ink:#0B0C0E;
  --blue:#1E4FFF;
  --grey:#9AA0A8;
  --grey-line:#D8DADD;
  --grey-tint:#F4F4F5;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  background:var(--paper);
  color:var(--ink);
  font-family:'ThmanyahSans', sans-serif;
  font-weight:300;
  min-height:100%;
}

.topbar{
  padding:32px clamp(20px,5vw,56px) 24px;
  display:flex;
  justify-content:center;
  background:transparent;
}

.logo{
  font-family:'ThmanyahDisplay', serif;
  font-weight:500;
  font-size:clamp(24px, 3.4vw, 34px);
  letter-spacing:0.02em;
}

main{
  max-width:720px;
  margin:0 auto;
  padding:clamp(8px,5vw,24px) clamp(20px,5vw,56px) 80px;
}

.intro{
  margin-bottom:clamp(36px,5vw,56px);
  max-width:560px;
  margin-left:auto;
  margin-right:auto;
  text-align:center;
}

.intro h1{
  font-family:'ThmanyahDisplay', serif;
  font-weight:500;
  font-size:clamp(28px,4.4vw,40px);
  line-height:1.25;
  margin-bottom:14px;
}

.intro p{
  font-weight:300;
  font-size:15px;
  color:var(--grey);
  line-height:1.7;
}

.section{
  border:1px solid var(--grey-line);
  padding:clamp(20px,4vw,36px);
  margin-bottom:24px;
}

.section-label{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:20px;
}

.box-num{
  font-weight:500;
  font-size:13px;
  color:var(--blue);
}

.box-title{
  font-weight:500;
  font-size:14px;
  letter-spacing:0.01em;
}

.field-label{
  font-size:12px;
  color:var(--grey);
  font-weight:300;
  margin-bottom:8px;
}

.field{
  margin-bottom:20px;
}

input[type="text"], input[type="datetime-local"]{
  width:100%;
  border:1px solid var(--grey-line);
  border-radius:0;
  padding:12px 14px;
  font-family:'ThmanyahSans', sans-serif;
  font-weight:300;
  font-size:15px;
  color:var(--ink);
  background:var(--paper);
  outline:none;
}

input:focus{border-color:var(--blue);}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}

.chip{
  border:1px solid var(--grey-line);
  padding:9px 16px;
  font-size:13px;
  font-weight:300;
  cursor:pointer;
  color:var(--ink);
  background:var(--paper);
  font-family:'ThmanyahSans', sans-serif;
  transition:background .12s ease, color .12s ease, border-color .12s ease;
}

.chip:hover{border-color:var(--blue); color:var(--blue);}

.chip.active{
  background:var(--blue);
  color:var(--paper);
  border-color:var(--blue);
}

button.btn-primary{
  border:none;
  border-radius:0;
  cursor:pointer;
  font-family:'ThmanyahSans', sans-serif;
  font-weight:500;
  font-size:14px;
  letter-spacing:0.01em;
  padding:14px 18px;
  background:var(--blue);
  color:var(--paper);
  width:100%;
  transition:opacity .12s ease;
}

button.btn-primary:hover{opacity:.88;}

.countdown-title{
  text-align:center;
  font-size:14px;
  color:var(--grey);
  font-weight:300;
  margin-bottom:20px;
}

.countdown-title strong{
  color:var(--ink);
  font-weight:500;
}

.countdown-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  border:1px solid var(--grey-line);
}

.countdown-cell{
  padding:24px 8px;
  text-align:center;
  border-left:1px solid var(--grey-line);
}

.countdown-cell:last-child{border-left:none;}

.countdown-cell .num{
  font-family:'ThmanyahDisplay', serif;
  font-weight:500;
  font-size:clamp(28px,5vw,40px);
  color:var(--ink);
  line-height:1;
  margin-bottom:8px;
  direction:ltr;
}

.countdown-cell .unit{
  font-size:12px;
  color:var(--grey);
  font-weight:300;
}

.done-state{
  text-align:center;
  padding:40px 10px;
  font-family:'ThmanyahDisplay', serif;
  font-weight:500;
  font-size:22px;
  color:var(--blue);
}

.empty-state{
  color:var(--grey);
  font-size:13px;
  text-align:center;
  padding:40px 10px;
}

footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:var(--grey);
  border-top:1px solid var(--grey-line);
}

footer a{
  color:var(--grey);
  text-decoration:none;
  border-bottom:1px solid var(--grey-line);
  transition:color .12s ease, border-color .12s ease;
}

footer a:hover{
  color:var(--blue);
  border-color:var(--blue);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">عــدّاد</div>
</div>

<main>
  <div class="intro">
    <h1>عدّ تنازلي لموعدك</h1>
    <p>اختر مناسبة جاهزة أو حدد تاريخك الخاص، وشاهد العد التنازلي مباشرة.</p>
  </div>

  <div class="section">
    <div class="section-label">

      <div class="countdown-cell"><div class="num" id="numDays">0</div><div class="unit">يوم</div></div>
      <div class="countdown-cell"><div class="num" id="numHours">0</div><div class="unit">ساعة</div></div>
      <div class="countdown-cell"><div class="num" id="numMinutes">0</div><div class="unit">دقيقة</div></div>

<script>
const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

/* ---- Hijri conversion: try native Intl (Umm al-Qura) first, else fall back
   to the tabular Islamic calendar (Kuwaiti algorithm), which is accurate
   to within a day or two and does not depend on browser support. ---- */

let useNativeHijri = true;
let hijriFormatter = null;
try{
  hijriFormatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {year:'numeric', month:'numeric', day:'numeric'});
  const testParts = hijriFormatter.formatToParts(new Date());
  if(!testParts || !testParts.some(p => p.type === 'year')){
    useNativeHijri = false;
  }
}catch(e){
  useNativeHijri = false;
}

function gregorianToJDN(year, month, day){
  const a = Math.floor((14 - month) / 12);
  const y = year + 4800 - a;
  const m = month + 12 * a - 3;
  return day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
}

function jdnToGregorian(jdn){
  const a = jdn + 32044;
  const b = Math.floor((4 * a + 3) / 146097);
  const c = a - Math.floor((146097 * b) / 4);
  const d = Math.floor((4 * c + 3) / 1461);
  const e = c - Math.floor((1461 * d) / 4);
  const m = Math.floor((5 * e + 2) / 153);
  const day = e - Math.floor((153 * m + 2) / 5) + 1;
  const month = m + 3 - 12 * Math.floor(m / 10);
  const year = 100 * b + d - 4800 + Math.floor(m / 10);
  return { y: year, m: month, d: day };
}

function jdnToIslamicTabular(jdn){
  const islamicEpoch = 1948440;
  let l = jdn - islamicEpoch + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const month = Math.floor((24 * l) / 709);
  const day = l - Math.floor((709 * month) / 24);
  const year = 30 * n + j - 30;
  return { y: year, m: month, d: day };
}

function islamicTabularToJDN(year, month, day){
  return day + Math.ceil(29.5 * (month - 1)) + (year - 1) * 354 + Math.floor((3 + 11 * year) / 30) + 1948440 - 1;
}

function gregorianToHijri(date){
  if(useNativeHijri){
    try{
      const parts = hijriFormatter.formatToParts(date);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      return { y: parseInt(map.year, 10), m: parseInt(map.month, 10), d: parseInt(map.day, 10) };
    }catch(e){
      useNativeHijri = false;
    }
  }
  const jdn = gregorianToJDN(date.getFullYear(), date.getMonth() + 1, date.getDate());
  return jdnToIslamicTabular(jdn);
}

function hijriToGregorian(hy, hm, hd){
  if(useNativeHijri){
    const today = new Date();
    const todayH = gregorianToHijri(today);
    const todayHijriDays = todayH.y * 354.36667 + todayH.m * 29.53 + todayH.d;
    const targetHijriDays = hy * 354.36667 + hm * 29.53 + hd;
    const diffDays = Math.round(targetHijriDays - todayHijriDays);

    let guess = new Date(today);
    guess.setDate(guess.getDate() + diffDays);

    for(let offset = -20; offset <= 20; offset++){
      const candidate = new Date(guess);
      candidate.setDate(candidate.getDate() + offset);
      const h = gregorianToHijri(candidate);
      if(h.y === hy && h.m === hm && h.d === hd){
        candidate.setHours(0, 0, 0, 0);
        return candidate;
      }
    }
  }
  // tabular fallback (also used if native search above failed to converge)
  const jdn = islamicTabularToJDN(hy, hm, hd);
  const g = jdnToGregorian(jdn);
  const date = new Date(g.y, g.m - 1, g.d);
  date.setHours(0, 0, 0, 0);
  return date;
}

function nextHijriDate(month, day){
  const todayH = gregorianToHijri(new Date());
  let targetYear = todayH.y;
  if(todayH.m > month || (todayH.m === month && todayH.d > day)){
    targetYear += 1;
  }
  return hijriToGregorian(targetYear, month, day);
}

function nextGregorianDate(month, day){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let year = today.getFullYear();
  let candidate = new Date(year, month - 1, day);
  if(candidate.getTime() < today.getTime()){
    candidate = new Date(year + 1, month - 1, day);
  }
  return candidate;
}

const EVENTS = [
  { id: 'ramadan', label: 'رمضان', type: 'hijri', m: 9, d: 1 },
  { id: 'eid-fitr', label: 'عيد الفطر', type: 'hijri', m: 10, d: 1 },
  { id: 'eid-adha', label: 'عيد الأضحى', type: 'hijri', m: 12, d: 10 },
  { id: 'hijri-new-year', label: 'رأس السنة الهجرية', type: 'hijri', m: 1, d: 1 },
  { id: 'ashura', label: 'يوم عاشوراء', type: 'hijri', m: 1, d: 10 },
  { id: 'mawlid', label: 'المولد النبوي', type: 'hijri', m: 3, d: 12 },
  { id: 'isra-miraj', label: 'الإسراء والمعراج', type: 'hijri', m: 7, d: 27 },
  { id: 'nisf-shaban', label: 'نصف شعبان', type: 'hijri', m: 8, d: 15 },
  { id: 'founding-day', label: 'يوم التأسيس', type: 'gregorian', m: 2, d: 22 },
  { id: 'national-day', label: 'اليوم الوطني السعودي', type: 'gregorian', m: 9, d: 23 },
  { id: 'new-year', label: 'رأس السنة الميلادية', type: 'gregorian', m: 1, d: 1 },
  { id: 'custom', label: 'تاريخ خاص', type: 'custom' }
];

function toLocalInputValue(date){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const h = String(date.getHours()).padStart(2, '0');
  const min = String(date.getMinutes()).padStart(2, '0');
  return `${y}-${m}-${d}T${h}:${min}`;
}

const eventName = document.getElementById('eventName');
const eventDate = document.getElementById('eventDate');
const quickChips = document.getElementById('quickChips');

EVENTS.forEach(ev => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (ev.id === 'custom' ? ' active' : '');
  chip.textContent = ev.label;
  chip.dataset.event = ev.id;
  quickChips.appendChild(chip);

  chip.addEventListener('click', () => {
    quickChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');

    if(ev.type === 'custom'){
      return;
    }

    try{
      let target = null;
      if(ev.type === 'hijri'){
        target = nextHijriDate(ev.m, ev.d);
      }else if(ev.type === 'gregorian'){
        target = nextGregorianDate(ev.m, ev.d);
      }

      if(target){
        eventDate.value = toLocalInputValue(target);
        eventName.value = ev.label;
      }
    }catch(err){
      eventName.value = ev.label;
      eventDate.focus();
    }
  });
});

let countdownInterval = null;

function pad(n){
  return String(n).padStart(2, '0');
}

function startCountdown(targetDate, name){
  const section = document.getElementById('countdownSection');
  const grid = document.getElementById('countdownGrid');
  section.style.display = 'block';
  document.getElementById('countdownEventName').textContent = name;

  if(countdownInterval) clearInterval(countdownInterval);

  function tick(){
    const now = new Date();
    const diff = targetDate.getTime() - now.getTime();

    if(diff <= 0){
      clearInterval(countdownInterval);
      grid.outerHTML = `<div class="done-state">وصل موعد ${name} 🎉</div>`;
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById('numDays').textContent = days;
    document.getElementById('numHours').textContent = pad(hours);
    document.getElementById('numMinutes').textContent = pad(minutes);
    document.getElementById('numSeconds').textContent = pad(seconds);
  }

  tick();
  countdownInterval = setInterval(tick, 1000);
}

document.getElementById('startBtn').addEventListener('click', () => {
  try{
    const raw = eventDate.value;
    if(!raw){
      eventDate.focus();
      eventDate.style.borderColor = '#1E4FFF';
      return;
    }
    const target = new Date(raw);
    const name = eventName.value.trim() || 'موعدك';
    startCountdown(target, name);
  }catch(err){
    const section = document.getElementById('countdownSection');
    section.style.display = 'block';
    section.querySelector('#countdownGrid, .done-state')?.remove?.();
  }
});
</script>
