:root{
  --paper:#FFFFFF;
  --ink:#0B0C0E;
  --blue:#1E4FFF;
  --grey:#9AA0A8;
  --grey-line:#D8DADD;
  --grey-tint:#F4F4F5;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  background:var(--paper);
  color:var(--ink);
  font-family:'ThmanyahSans', sans-serif;
  font-weight:300;
  min-height:100%;
}

body{
  position:relative;
  overflow-x:hidden;
}

.topbar{
  position:relative;
  z-index:2;
  padding:32px clamp(20px,5vw,56px) 24px;
  display:flex;
  justify-content:center;
  background:transparent;
  border:none;
}

.logo{
  font-family:'ThmanyahDisplay', serif;
  font-weight:700;
  font-size:clamp(24px, 3.4vw, 34px);
  letter-spacing:0.03em;
  font-feature-settings:"salt" 1, "ss01" 1;
  font-variant-alternates:stylistic(salt);
}

main{
  position:relative;
  z-index:2;
  max-width:1040px;
  margin:0 auto;
  padding:clamp(28px,5vw,64px) clamp(20px,5vw,56px) 80px;
}

.intro{
  margin-bottom:clamp(36px,5vw,56px);
  max-width:620px;
  margin-left:auto;
  margin-right:auto;
  text-align:center;
}

.intro h1{
  font-family:'ThmanyahDisplay', serif;
  font-weight:700;
  font-size:clamp(30px,4.6vw,44px);
  line-height:1.2;
  margin-bottom:14px;
}

.intro p{
  font-weight:300;
  font-size:15px;
  color:var(--grey);
  line-height:1.7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  border:1px solid var(--grey-line);
}

@media (max-width:760px){
  .grid{grid-template-columns:1fr;}
  .box + .box{border-top:1px solid var(--grey-line);}
}

.box{
  padding:clamp(20px,3vw,32px);
  display:flex;
  flex-direction:column;
  min-height:420px;
}

.box + .box{
  border-right:1px solid var(--grey-line);
}

@media (max-width:760px){
  .box + .box{border-right:none;}
}

.box-label{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:18px;
}

.box-num{
  font-family:'ThmanyahDisplay', serif;
  font-weight:700;
  font-size:13px;
  color:var(--blue);
}

.box-title{
  font-weight:500;
  font-size:14px;
  letter-spacing:0.01em;
}

textarea{
  width:100%;
  flex:1;
  min-height:180px;
  resize:vertical;
  border:1px solid var(--grey-line);
  border-radius:0;
  padding:14px;
  font-family:'ThmanyahSans', sans-serif;
  font-weight:300;
  font-size:15px;
  line-height:1.8;
  color:var(--ink);
  background:var(--grey-tint);
  outline:none;
}

textarea:focus{
  border-color:var(--blue);
  background:var(--paper);
}

textarea::placeholder{
  color:var(--grey);
}

textarea[readonly]{
  background:var(--grey-tint);
  color:var(--ink);
}

.options{
  margin-top:18px;
}

.opt-row-label{
  font-size:12px;
  color:var(--grey);
  margin-bottom:10px;
  font-weight:500;
}

.seps{
  display:flex;
  gap:0;
  border:1px solid var(--grey-line);
  margin-bottom:20px;
}

.seps label{
  flex:1;
  text-align:center;
  padding:11px 8px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  color:var(--ink);
  background:var(--paper);
  border-left:1px solid var(--grey-line);
  transition:background .12s ease, color .12s ease;
}

.seps label:last-child{border-left:none;}

.seps input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.seps label.active{
  background:var(--blue);
  color:var(--paper);
}

.count-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:20px;
}

.count-row .opt-row-label{
  margin-bottom:0;
  white-space:nowrap;
}

.count-row input[type="number"]{
  width:96px;
  border:1px solid var(--grey-line);
  border-radius:0;
  padding:10px 12px;
  font-family:'ThmanyahSans', sans-serif;
  font-weight:500;
  font-size:15px;
  color:var(--ink);
  background:var(--paper);
  outline:none;
  text-align:center;
}

.count-row input[type="number"]:focus{
  border-color:var(--blue);
}

.count-row span.max-hint{
  font-size:12px;
  color:var(--grey);
}

button{
  border:none;
  border-radius:0;
  cursor:pointer;
  font-family:'ThmanyahSans', sans-serif;
  font-weight:500;
  font-size:14px;
  letter-spacing:0.01em;
  padding:14px 18px;
  transition:opacity .12s ease, background .12s ease;
}

.btn-primary{
  background:var(--blue);
  color:var(--paper);
  width:100%;
}

.btn-primary:hover{opacity:0.88;}
.btn-primary:active{opacity:0.75;}

.btn-secondary{
  margin-top:18px;
  background:var(--paper);
  color:var(--ink);
  border:1px solid var(--ink);
  width:100%;
}

.btn-secondary:hover{background:var(--ink); color:var(--paper);}

.btn-secondary.copied{
  background:var(--blue);
  border-color:var(--blue);
  color:var(--paper);
}

.meta-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  font-size:12px;
  color:var(--grey);
}

footer{
  position:relative;
  z-index:2;
  text-align:center;
  padding:20px;
  font-size:12px;
  color:var(--grey);
  border-top:1px solid var(--grey-line);
}

footer a{
  color:var(--grey);
  text-decoration:none;
  border-bottom:1px solid var(--grey-line);
  transition:color .12s ease, border-color .12s ease;
}

footer a:hover{
  color:var(--blue);
  border-color:var(--blue);
}

@media (prefers-reduced-motion:no-preference){
  .btn-primary, .btn-secondary{transition-duration:.15s;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">تكـــرار</div>
</div>

<main>
  <div class="intro">
    <h1>كرر نصك بالشكل اللي تبيه</h1>
    <p>اكتب نصك، اختر الفاصل وعدد مرات التكرار، وطلع لك النتيجة جاهزة للنسخ.</p>
  </div>

  <div class="grid">
    <div class="box">
      <div class="box-label">
        <span class="box-num">01</span>
        <span class="box-title">النص الأصلي</span>
      </div>

      <textarea id="inputText" placeholder="اكتب أو الصق النص هنا..."></textarea>

      <div class="options">
        <div class="opt-row-label">الفاصل بين التكرارات</div>
        <div class="seps" id="sepGroup">
          <label class="active" data-value="newline">سطر جديد</label>
          <label data-value="comma">فاصلة</label>
          <label data-value="colon">:</label>
        </div>

        <div class="count-row">
          <span class="opt-row-label">عدد التكرار</span>
          <input type="number" id="repeatCount" value="2" min="1" max="999">
          <span class="max-hint">الحد الأقصى 999</span>
        </div>

        <button class="btn-primary" id="startBtn">ابدأ التكرار</button>
      </div>
    </div>

    <div class="box">
      <div class="box-label">
        <span class="box-num">02</span>
        <span class="box-title">النص المكرر</span>
      </div>

      <textarea id="outputText" placeholder="النتيجة تظهر هنا..." readonly></textarea>

      <button class="btn-secondary" id="copyBtn">نسخ النص</button>
      <div class="meta-row">
        <span id="charCount">0 حرف</span>
      </div>
    </div>
  </div>
</main>

<footer>تكـــرار — <a href="https://t1.adah.binjaafar.xyz">t1.adah.binjaafar.xyz</a></footer>

<script>
const sepGroup = document.getElementById('sepGroup');
const sepLabels = sepGroup.querySelectorAll('label');
let currentSep = 'newline';

sepLabels.forEach(label => {
  label.addEventListener('click', () => {
    sepLabels.forEach(l => l.classList.remove('active'));
    label.classList.add('active');
    currentSep = label.dataset.value;
  });
});

const sepMap = {
  newline: '\n',
  comma: '، ',
  colon: ' : '
};

const inputText = document.getElementById('inputText');
const outputText = document.getElementById('outputText');
const repeatCount = document.getElementById('repeatCount');
const startBtn = document.getElementById('startBtn');
const copyBtn = document.getElementById('copyBtn');
const charCount = document.getElementById('charCount');

repeatCount.addEventListener('input', () => {
  let v = parseInt(repeatCount.value || '1', 10);
  if(isNaN(v)) v = 1;
  if(v > 999) v = 999;
  if(v < 1) v = 1;
  repeatCount.value = v;
});

startBtn.addEventListener('click', () => {
  const text = inputText.value.trim();
  if(!text){
    inputText.focus();
    inputText.style.borderColor = '#1E4FFF';
    return;
  }
  let n = parseInt(repeatCount.value || '1', 10);
  if(isNaN(n) || n < 1) n = 1;
  if(n > 999) n = 999;

  const sep = sepMap[currentSep];
  const result = Array(n).fill(text).join(sep);
  outputText.value = result;
  charCount.textContent = result.length.toLocaleString('ar') + ' حرف';
});

copyBtn.addEventListener('click', async () => {
  if(!outputText.value){ return; }
  try{
    await navigator.clipboard.writeText(outputText.value);
  }catch(e){
    outputText.select();
    document.execCommand('copy');
  }
  copyBtn.textContent = 'تم النسخ';
  copyBtn.classList.add('copied');
  setTimeout(() => {
    copyBtn.textContent = 'نسخ النص';
    copyBtn.classList.remove('copied');
  }, 1400);
});
</script>

</body>
</html>
